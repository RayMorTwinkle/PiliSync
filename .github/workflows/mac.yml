name: Build for Mac

on:
  workflow_call:
    inputs:
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
  workflow_dispatch:

jobs:
  build-mac-app:
    name: Release Mac
    runs-on: macos-26
    env:
      PUBLISH_SECRET: ${{ secrets.PUBLISH_SECRET }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 macOS

      - name: Disable SwiftPM
        run: flutter config --no-enable-swift-package-manager

      - name: Build Mac
        run: flutter build macos --release --dart-define-from-file=pili_release.json --no-pub

      - name: Prepare Upload
        run: |
          npm install --global create-dmg
          create-dmg build/macos/Build/Products/Release/PiliSync.app || true
        continue-on-error: true

      - name: Rename DMG
        run: mv PiliSync*.dmg PiliSync_macos_${{ env.version }}.dmg

      - name: Release
        if: ${{ github.event.inputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            PiliSync_macos_*.dmg

      - name: Publish to domestic channel
        if: ${{ github.event.inputs.tag != '' && env.PUBLISH_SECRET != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          BODY=$(gh release view "${{ github.event.inputs.tag }}" --repo "${{ github.repository }}" --json body -q .body 2>/dev/null || echo "")
          # 直连源站绕开 Cloudflare：CF 免费版 100s 超时，DMG ~70MB 上传+网盘转存会 524。
          # IP 是 SM 源站（ServerX DEVICES/README.md），变更时同步更新。
          curl -fsSL -X POST --resolve "wt.raymor.top:8443:122.51.139.252" \
            "https://wt.raymor.top:8443/update/publish" \
            -H "X-API-Key: ${PUBLISH_SECRET}" \
            -F "platform=macos" \
            -F "name=pilisync-latest.dmg" \
            -F "tag=${{ github.event.inputs.tag }}" \
            -F "body=${BODY}" \
            -F "file=@PiliSync_macos_${{ env.version }}.dmg"

      - name: Upload macos release
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: macOS-release
          path: PiliSync_macos_*.dmg

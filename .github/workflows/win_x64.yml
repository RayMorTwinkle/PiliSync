name: Build for Windows x64

on:
  workflow_call:
    inputs:
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
  workflow_dispatch:

jobs:
  build-windows-app:
    name: Release Windows x64
    runs-on: windows-latest
    env:
      PUBLISH_SECRET: ${{ secrets.PUBLISH_SECRET }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Add fastforge and Inno Setup
        run: |
          dart pub global activate fastforge
          choco install innosetup

      - name: Add Chinese language file for Inno Setup
        run: |
          Copy-Item "windows/packaging/exe/ChineseSimplified.isl" "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"
        shell: pwsh

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 windows

      - name: Build Windows
        run: |
          fastforge package --platform windows --targets exe --flutter-build-args="dart-define-from-file=pili_release.json,no-pub" --skip-clean

      - name: Prepare Upload
        run: |
          mkdir -p Release/PiliSync-Win
          mkdir -p PiliSync-Win-Setup
          mv build/windows/x64/runner/Release/* Release/PiliSync-Win/
          mv dist/**/*.exe PiliSync-Win-Setup/PiliSync_windows_${{env.version}}_x64_setup.exe

      - name: Compress
        run: |
          Compress-Archive -Path "Release/PiliSync-Win" -DestinationPath "PiliSync_windows_${{env.version}}_x64_portable.zip"
        shell: pwsh

      - name: Release
        if: ${{ github.event.inputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            PiliSync_windows_*.zip
            PiliSync-Win-Setup/PiliSync_windows_*.exe

      - name: Publish to domestic channel
        if: ${{ github.event.inputs.tag != '' && env.PUBLISH_SECRET != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          BODY=$(gh release view "${{ github.event.inputs.tag }}" --repo "${{ github.repository }}" --json body -q .body 2>/dev/null || echo "")
          # 直连源站绕开 Cloudflare：CF 免费版 100s 超时，上传+服务端网盘转存会 524。
          # IP 是 SM 源站（ServerX DEVICES/README.md），变更时同步更新。
          curl -fsSL -X POST --resolve "wt.raymor.top:8443:122.51.139.252" \
            "https://wt.raymor.top:8443/update/publish" \
            -H "X-API-Key: ${PUBLISH_SECRET}" \
            -F "platform=windows" \
            -F "name=pilisync-latest.exe" \
            -F "tag=${{ github.event.inputs.tag }}" \
            -F "body=${BODY}" \
            -F "file=@PiliSync-Win-Setup/PiliSync_windows_${{ env.version }}_x64_setup.exe"

      - name: Upload windows file release
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: Windows-file-x64-release
          path: PiliSync_windows_*.zip

      - name: Upload windows setup release
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: Windows-setup-x64-release
          path: PiliSync-Win-Setup/PiliSync_windows_*.exe
